name: MoySklad confirmed warehouse preflight

on:
  push:
    branches: [dekoray/21-inventory-sync]
    paths:
      - .github/workflows/moysklad-warehouse-audit.yml

permissions:
  contents: read

jobs:
  verify-confirmed-warehouse:
    if: github.repository == 'spayzik/sitedomera' && github.actor == 'spayzik'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate the confirmed warehouse and an isolated snapshot
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_ID: ${{ secrets.MOYSKLAD_STORE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { mkdir, mkdtemp, readFile, rm } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { products } from './src/data/products.ts'
          import { isUuid, STOCK_ENDPOINT } from './server/inventory/moysklad.mjs'
          import { parseInventory } from './src/lib/inventory.ts'

          const { MOYSKLAD_API_TOKEN, MOYSKLAD_STORE_ID } = process.env
          const env = { MOYSKLAD_API_TOKEN, MOYSKLAD_STORE_ID }
          let failureCode = 'invalid_result'
          function run(action, webroot) {
            const result = spawnSync(process.execPath, ['server/inventory/run.mjs', action], {
              env: { ...env, ...(webroot ? { DEKORAY_INVENTORY_WEBROOT: webroot } : {}) },
              encoding: 'utf8', timeout: 90_000,
            })
            if (result.status !== 0) {
              const error = JSON.parse(result.stderr)
              const allowed = ['AUTH_HOLD', 'CONFIG_HOLD', 'STORE_SELECTION_HOLD', 'MAPPING_HOLD',
                'STALE_SNAPSHOT', 'INVENTORY_RUN_FAILED', 'MOYSKLAD_NETWORK_ERROR']
              if (allowed.includes(error.status)) failureCode = error.status
              else if ([400, 401, 403, 429, 500, 502, 503, 504].includes(error.status)) failureCode = 'http_' + error.status
              throw new Error('Inventory command failed')
            }
            const summary = JSON.parse(result.stdout)
            if (summary.storeId !== MOYSKLAD_STORE_ID || summary.endpoint !== STOCK_ENDPOINT ||
                !summary.stockReportRead || !(summary.verifiedRows > 0)) throw new Error('Unverified stock')
            return summary
          }

          let stage = 'configuration'
          let webroot
          try {
            if (!MOYSKLAD_API_TOKEN || !isUuid(MOYSKLAD_STORE_ID)) throw new Error('Secrets required')
            stage = 'preflight'
            if (run('preflight').status !== 'preflight_complete') throw new Error('Preflight incomplete')
            stage = 'prepare_isolated_directory'
            webroot = await mkdtemp(join(tmpdir(), 'dekoray-stock-'))
            const generated = join(webroot, 'generated')
            await mkdir(generated, { mode: 0o700 })
            stage = 'write_isolated_snapshot'
            const report = run('publish', webroot)
            if (report.status !== 'published') throw new Error('Snapshot incomplete')
            stage = 'read_isolated_snapshot'
            const snapshot = parseInventory(JSON.parse(await readFile(join(generated, 'inventory.json'), 'utf8')), products)
            if (snapshot.expiresAt <= Date.now()) throw new Error('Expired snapshot')
            const counts = {
              matched: report.mapping.matched,
              unmatched: report.mapping.unmatched - report.unitUnverified,
              ambiguous: report.mapping.ambiguous,
              invalidUnits: report.unitUnverified,
            }
            const values = Object.values(counts)
            if (values.some(value => !Number.isSafeInteger(value) || value < 0) ||
                values.reduce((sum, value) => sum + value, 0) !== products.length ||
                !Number.isSafeInteger(report.verifiedRows) || report.verifiedRows > counts.matched) {
              throw new Error('Invalid aggregate mapping totals')
            }
            console.log('INVENTORY_AUDIT_COUNTS ' + JSON.stringify({ ...counts,
              verifiedProducts: report.verifiedRows, snapshotAt: snapshot.updatedAt }))
            console.log('Confirmed warehouse preflight and isolated snapshot verified.')
          } catch {
            console.error('Warehouse verification failed at ' + stage + ' (' + failureCode + ').')
            process.exitCode = 1
          } finally {
            if (webroot) await rm(webroot, { recursive: true, force: true })
          }
          NODE
