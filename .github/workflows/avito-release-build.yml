name: Build release with approved Avito reviews

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avito-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: avito-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:avito
      - name: Refresh the review snapshot
        run: npm run sync:avito -- --publish
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_ACCOUNT_ID: ${{ vars.AVITO_ACCOUNT_ID }}
          AVITO_REVIEW_PUBLICATION_APPROVED: ${{ vars.AVITO_REVIEW_PUBLICATION_APPROVED }}
      - run: npm run build
        env:
          VITE_YM_ID: ${{ vars.VITE_YM_ID }}
          VITE_AVITO_PROFILE_URL: ${{ vars.VITE_AVITO_PROFILE_URL }}
      - run: npm run verify:production
      - uses: actions/upload-artifact@v4
        with:
          name: dekoray-avito-release
          path: dist
          if-no-files-found: error
          retention-days: 3
