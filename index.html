<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />

    <!-- SITE markers are filled from CONTACTS by vite.config.ts. -->
    <title>__SITE_HOME_TITLE__</title>
    <meta
      name="description"
      content="__SITE_HOME_DESCRIPTION__"
    />
    <meta name="keywords" content="бамбуковые стеновые панели, декоративные рейки, стеновые панели Москва, __SITE_BRAND__" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_CANONICAL_URL__" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_CANONICAL_URL__" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="__SITE_BRAND__" />
    <meta property="og:title" content="__SITE_HOME_TITLE__" />
    <meta property="og:description" content="__SITE_HOME_DESCRIPTION__" />
    <meta property="og:image" content="__SITE_OG_IMAGE_URL__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_HOME_TITLE__" />
    <meta name="twitter:description" content="__SITE_HOME_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_OG_IMAGE_URL__" />

    <!-- Локальные шрифты вместо Google Fonts: без внешних блокирующих запросов -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/unbounded-300-22.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Микроразметка: организация с адресом шоурума -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "__SITE_BRAND__",
      "url": "__SITE_CANONICAL_URL__",
      "telephone": "__SITE_PHONE__",
      "image": "__SITE_OG_IMAGE_URL__",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "RU",
        "addressLocality": "__SITE_CITY__",
        "streetAddress": "__SITE_STREET_ADDRESS__"
      },
      "openingHours": "__SITE_OPENING_HOURS__",
      "sameAs": ["__SITE_TELEGRAM__", "__SITE_TELEGRAM_CHANNEL__"]
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
