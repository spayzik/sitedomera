<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />

    <!-- SITE markers are filled from CONTACTS by vite.config.ts. -->
    <title>__SITE_BRAND__ — бамбуковые стеновые панели премиум-класса</title>
    <meta
      name="description"
      content="__SITE_BRAND__ — бамбуковые стеновые панели 1220×3000 мм и декоративные рейки. Склад и шоурум в __SITE_ADDRESS__, отправка в день заказа, без записи."
    />
    <meta name="keywords" content="бамбуковые панели, стеновые панели, панели WPC, декоративные рейки, шоурум __SITE_CITY__, __SITE_BRAND__" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_CANONICAL_URL__" />

    <link rel="preload" as="image" href="./catalog/hero/hero.webp" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_CANONICAL_URL__" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="__SITE_BRAND__" />
    <meta property="og:title" content="__SITE_BRAND__ — бамбуковые стеновые панели премиум-класса" />
    <meta property="og:description" content="Бамбуковые стеновые панели 1220×3000 мм и рейки. Склад и шоурум в __SITE_CITY__, отправка в день заказа." />
    <meta property="og:image" content="__SITE_OG_IMAGE_URL__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Локальные шрифты вместо Google Fonts: без внешних блокирующих запросов -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/unbounded-400-24.woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />

    <!-- Микроразметка: организация с адресом шоурума -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "__SITE_BRAND__",
      "url": "__SITE_CANONICAL_URL__",
      "telephone": "__SITE_PHONE__",
      "image": "__SITE_OG_IMAGE_URL__",
      "priceRange": "₽₽",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "RU",
        "addressLocality": "__SITE_CITY__",
        "streetAddress": "__SITE_STREET_ADDRESS__"
      },
      "openingHours": "__SITE_OPENING_HOURS__",
      "sameAs": ["__SITE_TELEGRAM__", "__SITE_TELEGRAM_CHANNEL__"]
    }
    </script>

    <!-- Яндекс.Метрика: ID подставляется при сборке из VITE_YM_ID; без него блок удаляется -->
    <!--YM-COUNTER-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
